<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>分级管理 · 云创智慧平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.8.8/dist/index.css" />
  <style>
    :root {
      --brand: #2f6bff; --brand-deep: #1f4fd6; --brand-soft: #ebf1ff;
      --ok: #16a36a; --off: #ef4d5e; --warn: #e6952c;
      --bg: #f4f6fb; --surface: #ffffff; --surface-2: #f8fafc;
      --line: #e6eaf2; --line-soft: #eef1f7;
      --ink: #1b2533; --ink-2: #586273; --ink-3: #7c8696;
      --side: #1b2330; --side-2: #12171f;
      --r-sm: 8px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
      --fs-cap: 12px; --fs-sm: 13px; --fs: 14px; --fs-md: 16px; --fs-lg: 20px;
      --sh-sm: 0 1px 2px rgba(16,24,40,.05); --sh-md: 0 6px 20px rgba(16,24,40,.07);
      --sb-w: 226px; --sb-w-collapsed: 64px;
      --el-color-primary: #2f6bff; --el-color-primary-light-3: #5c8bff; --el-color-primary-light-5: #84a7ff;
      --el-color-primary-light-7: #adc5ff; --el-color-primary-light-8: #c1d3ff; --el-color-primary-light-9: #ebf1ff; --el-color-primary-dark-2: #1f4fd6;
      --el-border-radius-base: 8px; --el-font-size-base: 14px;
      --el-text-color-regular: #586273; --el-border-color: #e6eaf2; --el-border-color-lighter: #eef1f7;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: "Inter","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif; background: var(--bg); color: var(--ink); font-size: var(--fs); -webkit-font-smoothing: antialiased; }
    #app { height: 100vh; }
    .shell { display: flex; height: 100vh; overflow: hidden; }
    :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
    .sidebar { width: var(--sb-w); flex: 0 0 var(--sb-w); background: linear-gradient(180deg,var(--side),var(--side-2)); color: #c3ccd9; display: flex; flex-direction: column; transition: flex-basis .22s,width .22s,transform .25s; }
    .sidebar.collapsed { width: var(--sb-w-collapsed); flex-basis: var(--sb-w-collapsed); }
    .brand { height: 60px; display: flex; align-items: center; gap: 11px; padding: 0 20px; color: #fff; font-weight: 700; font-size: var(--fs-md); letter-spacing: .3px; border-bottom: 1px solid rgba(255,255,255,.07); white-space: nowrap; }
    .brand .logo { width: 30px; height: 30px; border-radius: var(--r-md); flex: 0 0 auto; background: linear-gradient(135deg,#5b8bff,#2f6bff); display: grid; place-items: center; font-size: 15px; box-shadow: 0 4px 14px rgba(47,107,255,.5); }
    .sidebar.collapsed .brand { padding: 0; justify-content: center; }
    .sidebar.collapsed .brand .brand-txt { display: none; }
    .version-tag { display: inline-flex; align-items: center; font-size: 10px; font-weight: 500; background: rgba(255,255,255,.15); color: rgba(255,255,255,.7); padding: 1px 5px; border-radius: 4px; letter-spacing: 0; flex-shrink: 0; margin-left: 4px; }
    .sidebar.collapsed .version-tag { display: none; }
    .nav { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px 10px; }
    .nav::-webkit-scrollbar { width: 6px; } .nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: var(--r-pill); }
    .nav-group { margin-bottom: 2px; }
    .nav-group > .nav-title { display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: var(--r-md); font-size: var(--fs-sm); color: #aab4c3; cursor: pointer; user-select: none; transition: color .15s,background .15s; white-space: nowrap; }
    .nav-title .ng-ic { font-size: 16px; flex: 0 0 auto; display: inline-flex; }
    .nav-title .ng-txt { flex: 1; } .nav-title .caret { font-size: 13px; opacity: .55; transition: transform .2s; }
    .nav-group.open > .nav-title .caret { transform: rotate(180deg); }
    .nav-title:hover { color: #fff; background: rgba(255,255,255,.05); }
    .nav-group.open > .nav-title, .nav-group.has-active > .nav-title { color: #fff; }
    .nav-children { overflow: hidden; padding: 2px 0 4px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px 9px 38px; font-size: var(--fs-sm); color: #aab4c3; cursor: pointer; position: relative; border-radius: var(--r-md); transition: all .15s; white-space: nowrap; margin: 1px 0; }
    .nav-item .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .4; flex: 0 0 auto; }
    .nav-item:hover { color: #fff; background: rgba(255,255,255,.05); }
    .nav-item.active { color: #fff; background: rgba(47,107,255,.18); }
    .nav-item.active .dot { opacity: 1; background: #6f9bff; }
    .nav-item.active::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: var(--r-pill); background: var(--brand); }
    .sidebar.collapsed .nav-title { justify-content: center; padding: 13px 0; }
    .sidebar.collapsed .nav-title .ng-txt, .sidebar.collapsed .nav-title .caret { display: none; }
    .sidebar.collapsed .nav-children { display: none !important; }
    .sidebar.collapsed .nav-group.has-active > .nav-title { background: rgba(47,107,255,.18); }
    .sidebar.collapsed .nav-group.has-active > .nav-title .ng-ic { color: #6f9bff; }
    .sb-foot { border-top: 1px solid rgba(255,255,255,.07); padding: 10px; }
    .sb-collapse { width: 100%; height: 36px; border-radius: var(--r-md); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color: #aab4c3; font-size: var(--fs-sm); transition: all .15s; }
    .sb-collapse:hover { color: #fff; background: rgba(255,255,255,.07); }
    .nav-backdrop { position: fixed; inset: 0; background: rgba(12,18,28,.45); z-index: 55; }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { height: 60px; flex: 0 0 60px; background: var(--surface); border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; padding: 0 20px; gap: 16px; }
    .topbar .ico { font-size: 18px; color: var(--ink-2); cursor: pointer; padding: 8px; border-radius: var(--r-sm); transition: background .15s; }
    .topbar .ico:hover { background: rgba(16,24,40,.05); }
    .topbar .tenant-switcher { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 8px !important; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); color: var(--ink); }
    .topbar .tenant-switcher:hover { border-color: var(--brand); }
    .topbar .tenant-switcher .tenant-name { font-size: 13px; font-weight: 500; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .crumb { display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--ink-2); }
    .crumb .sep { opacity: .5; } .crumb .cur { color: var(--ink); font-weight: 500; }
    .crumb .home-link { color: var(--ink-2); cursor: pointer; } .crumb .home-link:hover { color: var(--brand); }
    .spacer { flex: 1; }
    .content { flex: 1; overflow-y: auto; padding: 20px; }
    .panel { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-sm); overflow: hidden; }
    .filter-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 16px 20px 0; }
    .table-zone { padding: 12px 20px 20px; }
    .empty-cell { text-align: center; padding: 40px; color: var(--ink-3); }
  </style>

  <link rel="stylesheet" href="shared-sidebar.css">
</head>
<body>
<div id="app">
  <div class="shell">
    <aside class="sidebar" :class="{ collapsed, 'mobile-open': mobileNav }">
      <div class="brand"><span class="logo">云</span><span class="brand-txt">云创智慧平台</span><span class="version-tag">v1.0.5</span></div>
      <nav class="nav">
        <div v-for="g in menuGroups" :key="g.title" class="nav-group"
             :class="{ open: g.open && !collapsed, 'has-active': g.items.includes(activeMenu) || (g.singleLink && g.title === activeMenu) }">
          <a v-if="g.singleLink" class="nav-title nav-link"
             :href="menuHref[g.title] || '#'"
             :class="{ active: g.title === activeMenu }"
             @click="onMenuClick(g.title, $event)">
            <el-icon class="ng-ic"><component :is="iconComp(g.icon)"></component></el-icon>
            <span class="ng-txt">{{ g.title }}</span>
          </a>
          <div v-else class="nav-title" @click="toggleGroup(g)" :tabindex="0" @keyup.enter="toggleGroup(g)">
            <el-icon class="ng-ic"><component :is="iconComp(g.icon)"></component></el-icon>
            <span class="ng-txt">{{ g.title }}</span>
            <el-icon class="caret"><component :is="iconComp('ArrowDown')"></component></el-icon>
          </div>
          <div v-if="!g.singleLink" class="nav-children" v-show="g.open && !collapsed">
            <a v-for="item in g.items" :key="item"
               :href="menuHref[item] || '#'"
               class="nav-item"
               :class="{ active: item === activeMenu }"
               @click="onMenuClick(item, $event)">
              <el-icon v-if="submenuIcon(item)" class="ni-ic"><component :is="iconComp(submenuIcon(item))"></component></el-icon>
              <span v-else class="dot"></span>
              <span class="ni-txt">{{ item }}</span>
            </a>
          </div>
        </div>
      </nav>
      <div class="sb-foot">
        <div class="sb-collapse" tabindex="0" @click="collapsed = !collapsed" @keyup.enter="collapsed = !collapsed">
          <el-icon><component :is="iconComp(collapsed ? 'Expand' : 'Fold')"></component></el-icon>
          <span v-if="!collapsed">收起菜单</span>
        </div>
      </div>
    </aside>
    <div class="nav-backdrop" v-if="mobileNav" @click="mobileNav = false"></div>
    <div class="main">
      <header class="topbar">
        <span class="ico hamburger" @click="mobileNav = !mobileNav"><el-icon><Expand></Expand></el-icon></span>
        <div class="crumb">
          <span class="home-link" tabindex="0"><a href="index.html" style="color:inherit;text-decoration:none">首页</a></span>
          <span class="sep">/</span><span class="">系统管理</span>
          <span class="sep">/</span><span class="cur">分级管理</span>
        </div>
        <div class="spacer"></div>
        <el-dropdown trigger="click" @command="switchTenant">
          <span class="ico tenant-switcher" :title="'当前租户: ' + currentTenantName">
            <el-icon><OfficeBuilding></OfficeBuilding></el-icon>
            <span class="tenant-name">{{ currentTenantName }}</span>
            <el-icon class="mini"><ArrowDown></ArrowDown></el-icon>
          </span>
          <template #dropdown><el-dropdown-menu>
            <el-dropdown-item v-for="t in availableTenants" :key="t.id" :command="t.id" :disabled="t.id === currentTenantId">
              <el-icon><Check v-if="t.id === currentTenantId"></Check></el-icon>{{ t.name }}
            </el-dropdown-item>
          </el-dropdown-menu></template>
        </el-dropdown>
      </header>
      <main class="content">
        <div class="panel">
          <!-- 筛选栏 -->
          <div class="filter-bar">
            <el-input v-model="queryParams.deptName" placeholder="组织名称" clearable style="width:200px" @keyup.enter="handleQuery"></el-input>
            <el-select v-model="queryParams.status" placeholder="状态" clearable style="width:120px">
              <el-option label="正常" value="0"></el-option>
              <el-option label="停用" value="1"></el-option>
            </el-select>
            <el-button type="primary" :icon="Search" @click="handleQuery">搜索</el-button>
            <el-button :icon="Refresh" @click="resetQuery">重置</el-button>
            <div style="flex:1"></div>
            <el-button type="primary" plain :icon="Sort" @click="toggleExpandAll">{{ isExpandAll ? '折叠' : '展开' }}全部</el-button>
            <el-button type="primary" :icon="Plus" @click="handleAdd(null)">新增</el-button>
          </div>
          <!-- 树表格 -->
          <div class="table-zone">
            <el-table
              v-if="refreshTable"
              :data="filteredTreeData"
              row-key="id"
              border
              :default-expand-all="isExpandAll"
              :tree-props="{ children: 'children', hasChildren: 'hasChildren' }"
              :header-cell-style="{background:'#f5f8fd',color:'#586273',fontWeight:'600',fontSize:'13px'}"
            >
              <el-table-column prop="name" label="组织名称" width="220" show-overflow-tooltip></el-table-column>
              <el-table-column prop="orderNum" label="排序" width="90" align="center"></el-table-column>
              <el-table-column prop="leader" label="负责人" width="110" align="center"></el-table-column>
              <el-table-column prop="phone" label="联系电话" width="140" align="center"></el-table-column>
              <el-table-column prop="email" label="邮箱" width="200" show-overflow-tooltip></el-table-column>
              <el-table-column label="状态" width="90" align="center">
                <template #default="{ row }">
                  <el-tag size="small" :type="row.status === '0' ? 'success' : 'danger'">{{ row.status === '0' ? '正常' : '停用' }}</el-tag>
                </template>
              </el-table-column>
              <el-table-column prop="createTime" label="创建时间" width="170" align="center"></el-table-column>
              <el-table-column label="操作" width="220" align="center" fixed="right">
                <template #default="{ row }">
                  <el-button link type="primary" :icon="Edit" size="small" @click="handleEdit(row)">编辑</el-button>
                  <el-button link type="primary" :icon="Plus" size="small" @click="handleAdd(row)">新增</el-button>
                  <el-button link type="danger" :icon="Delete" size="small" @click="handleDelete(row)">删除</el-button>
                </template>
              </el-table-column>
            </el-table>
            <div class="empty-cell" v-if="!filteredTreeData.length">暂无组织数据</div>
          </div>
        </div>

        <!-- 新增/编辑弹窗 -->
        <el-dialog v-model="dialogVisible" :title="editing ? '编辑组织' : '新增组织'" width="680px" @close="onDialogClose">
          <el-form ref="formRef" :model="form" :rules="rules" label-width="100px" style="padding-right:20px">
            <el-row :gutter="20">
              <el-col :span="24" v-if="form.parentId !== 0">
                <el-form-item label="上级组织" prop="parentId">
                  <el-tree-select
                    v-model="form.parentId"
                    :data="parentDeptOptions"
                    :props="{ label: 'name', children: 'children' }"
                    node-key="id"
                    placeholder="选择上级组织"
                    check-strictly
                    value-key="id"
                    style="width:100%"
                  ></el-tree-select>
                </el-form-item>
              </el-col>
              <el-col :span="24" v-else>
                <el-form-item label="上级组织">
                  <el-tag type="info">主类目</el-tag>
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="组织名称" prop="name">
                  <el-input v-model="form.name" placeholder="请输入组织名称" maxlength="30"></el-input>
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="显示排序" prop="orderNum">
                  <el-input-number v-model="form.orderNum" :min="0" :max="999" controls-position="right" style="width:100%"></el-input-number>
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="负责人" prop="leader">
                  <el-input v-model="form.leader" placeholder="请输入负责人" maxlength="20"></el-input>
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="联系电话" prop="phone">
                  <el-input v-model="form.phone" placeholder="请输入联系电话" maxlength="11"></el-input>
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="邮箱" prop="email">
                  <el-input v-model="form.email" placeholder="请输入邮箱" maxlength="50"></el-input>
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="组织状态">
                  <el-radio-group v-model="form.status">
                    <el-radio value="0">正常</el-radio>
                    <el-radio value="1">停用</el-radio>
                  </el-radio-group>
                </el-form-item>
              </el-col>
            </el-row>
          </el-form>
          <template #footer>
            <el-button @click="dialogVisible = false">取消</el-button>
            <el-button type="primary" @click="submitForm">确定</el-button>
          </template>
        </el-dialog>
      </main>
    </div>
  </div>
</div>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="shared-menu.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.8.8/dist/index.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
  <script src="js/shared-data.js"></script>
  <script>
const { ref, reactive, computed, createApp, nextTick } = Vue;

const app = createApp({
  setup() {
    const shared = createSharedSetup('分级管理');
    const SD = window.SharedData;

    /* ===== 组织数据 ===== */
    const depts = reactive(SD ? SD.DEPTS.map(d => ({ ...d })) : []);

    /* ===== 构建树 ===== */
    const buildTree = (list, parentId) => {
      return list.filter(d => d.parentId === parentId)
        .map(d => ({ ...d, children: buildTree(list, d.id).length ? buildTree(list, d.id) : undefined }))
        .sort((a, b) => a.orderNum - b.orderNum);
    };

    const allTreeData = computed(() => buildTree(depts, 0));

    /* ===== 筛选 ===== */
    const queryParams = reactive({ deptName: '', status: '' });
    const isExpandAll = ref(true);
    const refreshTable = ref(true);

    const filteredTreeData = computed(() => {
      if (!queryParams.deptName && !queryParams.status) return allTreeData.value;
      // 递归过滤树：保留匹配节点及其祖先链和子树
      const filterNode = (nodes) => {
        const result = [];
        for (const node of nodes) {
          let matched = true;
          if (queryParams.deptName && !node.name.includes(queryParams.deptName)) matched = false;
          if (queryParams.status && node.status !== queryParams.status) matched = false;
          const children = node.children ? filterNode(node.children) : [];
          if (matched || children.length) {
            result.push({ ...node, children: children.length ? children : undefined });
          }
        }
        return result;
      };
      return filterNode(allTreeData.value);
    });

    const handleQuery = () => { isExpandAll.value = true; toggleExpandAll(); };
    const resetQuery = () => { queryParams.deptName = ''; queryParams.status = ''; isExpandAll.value = true; toggleExpandAll(); };

    const toggleExpandAll = () => {
      refreshTable.value = false;
      isExpandAll.value = !isExpandAll.value;
      nextTick(() => { refreshTable.value = true; });
    };

    /* ===== 上级组织选项（排除自身及子节点） ===== */
    const parentDeptOptions = computed(() => {
      if (!editing.value || !form.id) return allTreeData.value;
      // 排除当前编辑节点及其所有子节点（不能将自己设为自己的父级）
      const getChildIds = (pid) => {
        const ids = [pid];
        depts.filter(d => d.parentId === pid).forEach(d => ids.push(...getChildIds(d.id)));
        return ids;
      };
      const excludeIds = getChildIds(form.id);
      const filterTree = (nodes) => {
        return nodes.filter(n => !excludeIds.includes(n.id))
          .map(n => ({ ...n, children: n.children ? filterTree(n.children) : undefined }))
          .filter(n => true);
      };
      return filterTree(allTreeData.value);
    });

    /* ===== 新增/编辑 ===== */
    const dialogVisible = ref(false);
    const editing = ref(false);
    const formRef = ref(null);
    const form = reactive({ id: null, parentId: 0, name: '', orderNum: 0, leader: '', phone: '', email: '', status: '0' });
    const rules = {
      parentId: [{ required: true, message: '请选择上级组织', trigger: 'change' }],
      name: [{ required: true, message: '请输入组织名称', trigger: 'blur' }, { min: 2, max: 20, message: '长度在 2 到 20 个字符', trigger: 'blur' }],
      orderNum: [{ required: true, message: '请输入显示排序', trigger: 'blur' }],
      email: [{ type: 'email', message: '请输入正确的邮箱', trigger: 'blur' }],
    };
    const resetForm = () => { Object.assign(form, { id: null, parentId: 0, name: '', orderNum: 0, leader: '', phone: '', email: '', status: '0' }); };
    const onDialogClose = () => { formRef.value?.clearValidate(); };
    const handleAdd = (row) => {
      resetForm();
      if (row) { form.parentId = row.id; }
      else { form.parentId = 0; form.orderNum = 0; }
      editing.value = false;
      dialogVisible.value = true;
    };
    const handleEdit = (row) => {
      resetForm();
      Object.assign(form, JSON.parse(JSON.stringify(row)));
      editing.value = true;
      dialogVisible.value = true;
    };
    const submitForm = async () => {
      try { await formRef.value.validate(); } catch { return; }
      if (editing.value) {
        const idx = depts.findIndex(d => d.id === form.id);
        if (idx > -1) Object.assign(depts[idx], form);
        ElementPlus.ElMessage.success('修改成功');
      } else {
        const newId = Math.max(...depts.map(d => d.id), 99) + 1;
        depts.push({ ...form, id: newId, createTime: new Date().toISOString().slice(0, 19).replace('T', ' ') });
        ElementPlus.ElMessage.success('新增成功');
      }
      dialogVisible.value = false;
    };

    /* ===== 删除 ===== */
    const hasChildren = (deptId) => depts.some(d => d.parentId === deptId);
    const handleDelete = (row) => {
      if (hasChildren(row.id)) {
        ElementPlus.ElMessage.warning('该组织下存在子组织，不允许删除');
        return;
      }
      ElementPlus.ElMessageBox.confirm(`确认删除组织「${row.name}」吗？`, '提示', { type: 'warning' })
        .then(() => {
          const idx = depts.findIndex(d => d.id === row.id);
          if (idx > -1) depts.splice(idx, 1);
          ElementPlus.ElMessage.success('删除成功');
        }).catch(() => {});
    };

    return { ...shared,
      filteredTreeData, queryParams, isExpandAll, refreshTable,
      handleQuery, resetQuery, toggleExpandAll,
      dialogVisible, editing, formRef, form, rules, parentDeptOptions,
      onDialogClose, handleAdd, handleEdit, submitForm,
      handleDelete,
      Plus: ElementPlusIconsVue?.Plus, Edit: ElementPlusIconsVue?.Edit, Delete: ElementPlusIconsVue?.Delete,
      Search: ElementPlusIconsVue?.Search, Refresh: ElementPlusIconsVue?.Refresh, Sort: ElementPlusIconsVue?.Sort,
      OfficeBuilding: ElementPlusIconsVue?.OfficeBuilding, Expand: ElementPlusIconsVue?.Expand,
      ArrowDown: ElementPlusIconsVue?.ArrowDown, Check: ElementPlusIconsVue?.Check,
    };
  }
});
app.use(ElementPlus);
if (window.ElementPlusIconsVue) {
  for (const [k, v] of Object.entries(window.ElementPlusIconsVue)) app.component(k, v);
}
app.mount('#app');
  </script>
