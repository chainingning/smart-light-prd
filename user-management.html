<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户管理 · 云创智慧平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.8.8/dist/index.css" />
  <style>
    :root {
      --brand: #2f6bff; --brand-deep: #1f4fd6; --brand-soft: #ebf1ff;
      --ok: #16a36a; --off: #ef4d5e; --warn: #e6952c;
      --bg: #f4f6fb; --surface: #ffffff; --surface-2: #f8fafc;
      --line: #e6eaf2; --line-soft: #eef1f7;
      --ink: #1b2533; --ink-2: #586273; --ink-3: #7c8696;
      --side: #1b2330; --side-2: #12171f;
      --r-sm: 8px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
      --fs-cap: 12px; --fs-sm: 13px; --fs: 14px; --fs-md: 16px; --fs-lg: 20px; --fs-xl: 26px;
      --sh-sm: 0 1px 2px rgba(16,24,40,.05); --sh-md: 0 6px 20px rgba(16,24,40,.07);
      --sb-w: 226px; --sb-w-collapsed: 64px;
      --el-color-primary: #2f6bff;
      --el-color-primary-light-3: #5c8bff; --el-color-primary-light-5: #84a7ff;
      --el-color-primary-light-7: #adc5ff; --el-color-primary-light-8: #c1d3ff;
      --el-color-primary-light-9: #ebf1ff; --el-color-primary-dark-2: #1f4fd6;
      --el-border-radius-base: 8px; --el-font-size-base: 14px;
      --el-text-color-regular: #586273; --el-border-color: #e6eaf2; --el-border-color-lighter: #eef1f7;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: "Inter","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif; background: var(--bg); color: var(--ink); font-size: var(--fs); -webkit-font-smoothing: antialiased; }
    #app { height: 100vh; }
    .shell { display: flex; height: 100vh; overflow: hidden; }
    :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
    .sidebar { width: var(--sb-w); flex: 0 0 var(--sb-w); background: linear-gradient(180deg,var(--side),var(--side-2)); color: #c3ccd9; display: flex; flex-direction: column; transition: flex-basis .22s,width .22s,transform .25s; }
    .sidebar.collapsed { width: var(--sb-w-collapsed); flex-basis: var(--sb-w-collapsed); }
    .brand { height: 60px; display: flex; align-items: center; gap: 11px; padding: 0 20px; color: #fff; font-weight: 700; font-size: var(--fs-md); letter-spacing: .3px; border-bottom: 1px solid rgba(255,255,255,.07); white-space: nowrap; }
    .brand .logo { width: 30px; height: 30px; border-radius: var(--r-md); flex: 0 0 auto; background: linear-gradient(135deg,#5b8bff,#2f6bff); display: grid; place-items: center; font-size: 15px; box-shadow: 0 4px 14px rgba(47,107,255,.5); }
    .sidebar.collapsed .brand { padding: 0; justify-content: center; }
    .sidebar.collapsed .brand .brand-txt { display: none; }
    .version-tag { display: inline-flex; align-items: center; font-size: 10px; font-weight: 500; background: rgba(255,255,255,.15); color: rgba(255,255,255,.7); padding: 1px 5px; border-radius: 4px; letter-spacing: 0; flex-shrink: 0; margin-left: 4px; }
    .sidebar.collapsed .version-tag { display: none; }
    .nav { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px 10px; }
    .nav::-webkit-scrollbar { width: 6px; } .nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: var(--r-pill); }
    .nav-group { margin-bottom: 2px; }
    .nav-group > .nav-title { display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: var(--r-md); font-size: var(--fs-sm); color: #aab4c3; cursor: pointer; user-select: none; transition: color .15s,background .15s; white-space: nowrap; }
    .nav-title .ng-ic { font-size: 16px; flex: 0 0 auto; display: inline-flex; }
    .nav-title .ng-txt { flex: 1; } .nav-title .caret { font-size: 13px; opacity: .55; transition: transform .2s; }
    .nav-group.open > .nav-title .caret { transform: rotate(180deg); }
    .nav-title:hover { color: #fff; background: rgba(255,255,255,.05); }
    .nav-group.open > .nav-title, .nav-group.has-active > .nav-title { color: #fff; }
    .nav-children { overflow: hidden; padding: 2px 0 4px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px 9px 38px; font-size: var(--fs-sm); color: #aab4c3; cursor: pointer; position: relative; border-radius: var(--r-md); transition: all .15s; white-space: nowrap; margin: 1px 0; }
    .nav-item .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .4; flex: 0 0 auto; }
    .nav-item:hover { color: #fff; background: rgba(255,255,255,.05); }
    .nav-item.active { color: #fff; background: rgba(47,107,255,.18); }
    .nav-item.active .dot { opacity: 1; background: #6f9bff; }
    .nav-item.active::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: var(--r-pill); background: var(--brand); }
    .sidebar.collapsed .nav-title { justify-content: center; padding: 13px 0; }
    .sidebar.collapsed .nav-title .ng-txt, .sidebar.collapsed .nav-title .caret { display: none; }
    .sidebar.collapsed .nav-children { display: none !important; }
    .sidebar.collapsed .nav-group.has-active > .nav-title { background: rgba(47,107,255,.18); }
    .sidebar.collapsed .nav-group.has-active > .nav-title .ng-ic { color: #6f9bff; }
    .sb-foot { border-top: 1px solid rgba(255,255,255,.07); padding: 10px; }
    .sb-collapse { width: 100%; height: 36px; border-radius: var(--r-md); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color: #aab4c3; font-size: var(--fs-sm); transition: all .15s; }
    .sb-collapse:hover { color: #fff; background: rgba(255,255,255,.07); }
    .nav-backdrop { position: fixed; inset: 0; background: rgba(12,18,28,.45); z-index: 55; }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { height: 60px; flex: 0 0 60px; background: var(--surface); border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; padding: 0 20px; gap: 16px; }
    .topbar .ico { font-size: 18px; color: var(--ink-2); cursor: pointer; padding: 8px; border-radius: var(--r-sm); transition: background .15s; }
    .topbar .ico:hover { background: rgba(16,24,40,.05); }
    .topbar .tenant-switcher { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 8px !important; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); color: var(--ink); }
    .topbar .tenant-switcher:hover { border-color: var(--brand); }
    .topbar .tenant-switcher .tenant-name { font-size: 13px; font-weight: 500; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .crumb { display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--ink-2); }
    .crumb .sep { opacity: .5; } .crumb .cur { color: var(--ink); font-weight: 500; }
    .crumb .home-link { color: var(--ink-2); cursor: pointer; } .crumb .home-link:hover { color: var(--brand); }
    .spacer { flex: 1; }
    .content { flex: 1; overflow-y: auto; padding: 20px; }
    .panel { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-sm); overflow: hidden; }
    .filter-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 16px 20px 0; }
    .table-zone { padding: 12px 20px 20px; }
    .empty-cell { text-align: center; padding: 40px; color: var(--ink-3); }
    .dept-tree-panel { border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px; background: var(--surface-2); height: calc(100vh - 200px); overflow-y: auto; }
    .dept-tree-panel .dept-title { font-weight: 600; font-size: var(--fs-sm); color: var(--ink-2); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .user-content { display: flex; gap: 16px; padding: 20px; }
    .user-left { width: 240px; flex: 0 0 240px; }
    .user-right { flex: 1; min-width: 0; }
  </style>

  <link rel="stylesheet" href="shared-sidebar.css">
</head>
<body>
<div id="app">
  <div class="shell">
    <aside class="sidebar" :class="{ collapsed, 'mobile-open': mobileNav }">
      <div class="brand"><span class="logo">云</span><span class="brand-txt">云创智慧平台</span><span class="version-tag">v1.0.2</span></div>
      <nav class="nav">
        <div v-for="g in menuGroups" :key="g.title" class="nav-group"
             :class="{ open: g.open && !collapsed, 'has-active': g.items.includes(activeMenu) || (g.singleLink && g.title === activeMenu) }">
          <a v-if="g.singleLink" class="nav-title nav-link"
             :href="menuHref[g.title] || '#'"
             :class="{ active: g.title === activeMenu }"
             @click="onMenuClick(g.title, $event)">
            <el-icon class="ng-ic"><component :is="iconComp(g.icon)"></component></el-icon>
            <span class="ng-txt">{{ g.title }}</span>
          </a>
          <div v-else class="nav-title" @click="toggleGroup(g)" :tabindex="0" @keyup.enter="toggleGroup(g)">
            <el-icon class="ng-ic"><component :is="iconComp(g.icon)"></component></el-icon>
            <span class="ng-txt">{{ g.title }}</span>
            <el-icon class="caret"><component :is="iconComp('ArrowDown')"></component></el-icon>
          </div>
          <div v-if="!g.singleLink" class="nav-children" v-show="g.open && !collapsed">
            <a v-for="item in g.items" :key="item"
               :href="menuHref[item] || '#'"
               class="nav-item"
               :class="{ active: item === activeMenu }"
               @click="onMenuClick(item, $event)">
              <el-icon v-if="submenuIcon(item)" class="ni-ic"><component :is="iconComp(submenuIcon(item))"></component></el-icon>
              <span v-else class="dot"></span>
              <span class="ni-txt">{{ item }}</span>
            </a>
          </div>
        </div>
      </nav>
      <div class="sb-foot">
        <div class="sb-collapse" tabindex="0" @click="collapsed = !collapsed" @keyup.enter="collapsed = !collapsed">
          <el-icon><component :is="iconComp(collapsed ? 'Expand' : 'Fold')"></component></el-icon>
          <span v-if="!collapsed">收起菜单</span>
        </div>
      </div>
    </aside>
    <div class="nav-backdrop" v-if="mobileNav" @click="mobileNav = false"></div>
    <div class="main">
      <header class="topbar">
        <span class="ico hamburger" @click="mobileNav = !mobileNav"><el-icon><Expand></Expand></el-icon></span>
        <div class="crumb">
          <span class="home-link" tabindex="0"><a href="index.html" style="color:inherit;text-decoration:none">首页</a></span>
          <span class="sep">/</span><span class="">系统管理</span>
          <span class="sep">/</span><span class="cur">用户管理</span>
        </div>
        <div class="spacer"></div>
        <el-dropdown trigger="click" @command="switchTenant">
          <span class="ico tenant-switcher" :title="'当前租户: ' + currentTenantName">
            <el-icon><OfficeBuilding></OfficeBuilding></el-icon>
            <span class="tenant-name">{{ currentTenantName }}</span>
            <el-icon class="mini"><ArrowDown></ArrowDown></el-icon>
          </span>
          <template #dropdown><el-dropdown-menu>
            <el-dropdown-item v-for="t in availableTenants" :key="t.id" :command="t.id" :disabled="t.id === currentTenantId">
              <el-icon><Check v-if="t.id === currentTenantId"></Check></el-icon>{{ t.name }}
            </el-dropdown-item>
          </el-dropdown-menu></template>
        </el-dropdown>
      </header>
      <main class="content">
        <div class="panel">
          <div class="user-content">
            <!-- 左侧部门树 -->
            <div class="user-left">
              <div class="dept-tree-panel">
                <div class="dept-title"><el-icon><OfficeBuilding></OfficeBuilding></el-icon> 部门列表</div>
                <el-tree :data="deptTree" :props="{ label: 'name', children: 'children' }" node-key="id" :expand-on-click-node="false" highlight-current :default-expand-all="false" @node-click="handleDeptClick">
                  <template #default="{ node }">
                    <span>{{ node.label }}</span>
                  </template>
                </el-tree>
              </div>
            </div>
            <!-- 右侧用户列表 -->
            <div class="user-right">
              <!-- 筛选栏 -->
              <div class="filter-bar">
                <el-input v-model="queryParams.username" placeholder="用户名" clearable style="width:160px" @keyup.enter="handleQuery"></el-input>
                <el-input v-model="queryParams.phone" placeholder="手机号" clearable style="width:160px" @keyup.enter="handleQuery"></el-input>
                <el-select v-model="queryParams.status" placeholder="状态" clearable style="width:120px">
                  <el-option label="正常" value="0"></el-option>
                  <el-option label="停用" value="1"></el-option>
                </el-select>
                <el-date-picker v-model="queryParams.dateRange" type="daterange" range-separator="—" start-placeholder="开始日期" end-placeholder="结束日期" style="width:240px" value-format="YYYY-MM-DD"></el-date-picker>
                <el-button type="primary" :icon="Search" @click="handleQuery">搜索</el-button>
                <el-button :icon="Refresh" @click="resetQuery">重置</el-button>
                <div style="flex:1"></div>
                <el-button type="primary" :icon="Plus" @click="handleAdd">新增</el-button>
              </div>
              <!-- 工具栏 -->
              <div style="padding: 8px 20px 0; display:flex; gap:8px;">
                <el-button size="small" type="warning" plain :icon="Delete" :disabled="!selectedIds.length" @click="handleBatchDelete">批量删除</el-button>
                <el-button size="small" type="info" plain :icon="Upload" :disabled="!selectedIds.length" @click="handleImport">导入</el-button>
                <el-button size="small" type="success" plain :icon="Download" @click="handleExport">导出</el-button>
              </div>
              <!-- 表格 -->
              <div class="table-zone">
                <el-table :data="pagedList" border stripe @selection-change="handleSelectionChange" :header-cell-style="{background:'#f5f8fd',color:'#586273',fontWeight:'600',fontSize:'13px'}">
                  <el-table-column type="selection" width="50" align="center"></el-table-column>
                  <el-table-column label="编号" type="index" width="60" align="center" :index="(i)=>(page-1)*pageSize+i+1"></el-table-column>
                  <el-table-column prop="username" label="用户名" width="120" show-overflow-tooltip></el-table-column>
                  <el-table-column prop="nickname" label="姓名" width="100"></el-table-column>
                  <el-table-column label="部门" width="120">
                    <template #default="{ row }"><span style="color:var(--ink-2)">{{ deptName(row.deptId) }}</span></template>
                  </el-table-column>
                  <el-table-column prop="phone" label="手机号" width="130"></el-table-column>
                  <el-table-column label="状态" width="90" align="center">
                    <template #default="{ row }">
                      <el-switch v-model="row.status" active-value="0" inactive-value="1" @change="handleStatusChange(row)"></el-switch>
                    </template>
                  </el-table-column>
                  <el-table-column prop="createTime" label="创建时间" width="170"></el-table-column>
                  <el-table-column label="操作" width="280" align="center" fixed="right">
                    <template #default="{ row }">
                      <el-button link type="primary" :icon="Edit" size="small" @click="handleEdit(row)">编辑</el-button>
                      <el-button link type="danger" :icon="Delete" size="small" @click="handleDelete(row)">删除</el-button>
                      <el-button link type="warning" :icon="Key" size="small" @click="handleResetPwd(row)">重置密码</el-button>
                      <el-button link type="success" :icon="CircleCheck" size="small" @click="handleAssignRole(row)">分配角色</el-button>
                    </template>
                  </el-table-column>
                </el-table>
                <div class="empty-cell" v-if="!filteredList.length">暂无用户数据</div>
                <div style="display:flex; justify-content:flex-end; padding-top:16px;">
                  <el-pagination v-model:current-page="page" v-model:page-size="pageSize" :page-sizes="[10,20,50]" :total="filteredList.length" layout="total, sizes, prev, pager, next, jumper" background></el-pagination>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 新增/编辑弹窗 -->
        <el-dialog v-model="dialogVisible" :title="editing ? '编辑用户' : '新增用户'" width="680px" @close="onDialogClose">
          <el-form ref="formRef" :model="form" :rules="rules" label-width="100px" style="padding-right:20px">
            <el-row :gutter="20">
              <el-col :span="12">
                <el-form-item label="用户名" prop="username">
                  <el-input v-model="form.username" placeholder="请输入用户名" :disabled="editing" maxlength="30"></el-input>
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="姓名" prop="nickname">
                  <el-input v-model="form.nickname" placeholder="请输入姓名" maxlength="30"></el-input>
                </el-form-item>
              </el-col>
              <el-col :span="12" v-if="!editing">
                <el-form-item label="密码" prop="password">
                  <el-input v-model="form.password" type="password" placeholder="请输入密码" show-password maxlength="20"></el-input>
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="归属部门" prop="deptId">
                  <el-tree-select v-model="form.deptId" :data="deptTree" :props="{ label: 'name', children: 'children' }" node-key="id" placeholder="请选择部门" check-strictly style="width:100%"></el-tree-select>
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="手机号" prop="phone">
                  <el-input v-model="form.phone" placeholder="请输入手机号" maxlength="11"></el-input>
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="邮箱" prop="email">
                  <el-input v-model="form.email" placeholder="请输入邮箱" maxlength="50"></el-input>
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="性别">
                  <el-select v-model="form.sex" style="width:100%">
                    <el-option label="男" value="0"></el-option>
                    <el-option label="女" value="1"></el-option>
                    <el-option label="未知" value="2"></el-option>
                  </el-select>
                </el-form-item>
              </el-col>
              <el-col :span="12">
                <el-form-item label="状态">
                  <el-radio-group v-model="form.status">
                    <el-radio value="0">正常</el-radio>
                    <el-radio value="1">停用</el-radio>
                  </el-radio-group>
                </el-form-item>
              </el-col>
              <el-col :span="24">
                <el-form-item label="备注">
                  <el-input v-model="form.remark" type="textarea" :rows="2" placeholder="请输入备注" maxlength="200"></el-input>
                </el-form-item>
              </el-col>
            </el-row>
          </el-form>
          <template #footer>
            <el-button @click="dialogVisible = false">取消</el-button>
            <el-button type="primary" @click="submitForm">确定</el-button>
          </template>
        </el-dialog>

        <!-- 重置密码弹窗 -->
        <el-dialog v-model="resetPwdVisible" title="重置密码" width="420px">
          <el-form ref="resetFormRef" :model="resetPwdForm" :rules="resetRules" label-width="100px">
            <el-form-item label="用户名">
              <span style="font-weight:600">{{ resetTarget?.nickname }} ({{ resetTarget?.username }})</span>
            </el-form-item>
            <el-form-item label="新密码" prop="password">
              <el-input v-model="resetPwdForm.password" type="password" placeholder="请输入新密码" show-password maxlength="20" style="width:100%"></el-input>
            </el-form-item>
            <el-form-item label="确认密码" prop="confirmPassword">
              <el-input v-model="resetPwdForm.confirmPassword" type="password" placeholder="请再次输入密码" show-password maxlength="20" style="width:100%"></el-input>
            </el-form-item>
          </el-form>
          <template #footer>
            <el-button @click="resetPwdVisible = false">取消</el-button>
            <el-button type="primary" @click="submitResetPwd">确定</el-button>
          </template>
        </el-dialog>

        <!-- 分配角色弹窗 -->
        <el-dialog v-model="assignRoleVisible" title="分配角色" width="520px">
          <div style="margin-bottom:12px; color:var(--ink-3); font-size:13px;">
            当前用户：<span style="font-weight:600; color:var(--ink)">{{ assignTarget?.nickname }}</span>
          </div>
          <el-table :data="allRoles" border @selection-change="handleRoleSelection" :header-cell-style="{background:'#f5f8fd',color:'#586273',fontWeight:'600',fontSize:'13px'}">
            <el-table-column type="selection" width="50" align="center"></el-table-column>
            <el-table-column prop="roleName" label="角色名称"></el-table-column>
            <el-table-column prop="roleKey" label="权限字符" width="120"></el-table-column>
            <el-table-column label="状态" width="80" align="center">
              <template #default="{ row }"><el-tag size="small" :type="row.status === '0' ? 'success' : 'info'">{{ row.status === '0' ? '正常' : '停用' }}</el-tag></template>
            </el-table-column>
          </el-table>
          <template #footer>
            <el-button @click="assignRoleVisible = false">取消</el-button>
            <el-button type="primary" @click="submitAssignRole">确定</el-button>
          </template>
        </el-dialog>
      </main>
    </div>
  </div>
</div>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="shared-menu.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.8.8/dist/index.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
  <script src="js/shared-data.js"></script>
  <script>
const { ref, reactive, computed, createApp } = Vue;

const app = createApp({
  setup() {
    const shared = createSharedSetup('用户管理');
    const SD = window.SharedData;

    /* ===== 部门树 ===== */
    const depts = reactive(SD ? SD.DEPTS.map(d => ({ ...d })) : []);
    const deptTree = computed(() => {
      const build = (parentId) => {
        return depts.filter(d => d.parentId === parentId).map(d => ({
          ...d,
          children: build(d.id).length ? build(d.id) : undefined
        })).sort((a, b) => a.orderNum - b.orderNum);
      };
      return build(0);
    });
    const deptName = (deptId) => {
      const d = depts.find(d => d.id === deptId);
      return d ? d.name : '—';
    };
    const selectedDeptId = ref(null);
    const handleDeptClick = (data) => {
      selectedDeptId.value = data.id;
      page.value = 1;
    };

    /* ===== 用户数据 ===== */
    const users = reactive(SD ? SD.USERS.map(u => ({ ...u })) : []);

    /* ===== 查询 ===== */
    const queryParams = reactive({ username: '', phone: '', status: '', dateRange: [] });
    const selectedIds = ref([]);
    const page = ref(1);
    const pageSize = ref(10);

    const filteredList = computed(() => {
      return users.filter(u => {
        if (selectedDeptId.value && u.deptId !== selectedDeptId.value) return false;
        if (queryParams.username && !u.username.includes(queryParams.username)) return false;
        if (queryParams.phone && !u.phone.includes(queryParams.phone)) return false;
        if (queryParams.status && u.status !== queryParams.status) return false;
        if (queryParams.dateRange && queryParams.dateRange.length === 2) {
          const d = u.createTime.slice(0, 10);
          if (d < queryParams.dateRange[0] || d > queryParams.dateRange[1]) return false;
        }
        return true;
      });
    });
    const pagedList = computed(() => {
      const start = (page.value - 1) * pageSize.value;
      return filteredList.value.slice(start, start + pageSize.value);
    });

    const handleQuery = () => { page.value = 1; };
    const resetQuery = () => { queryParams.username = ''; queryParams.phone = ''; queryParams.status = ''; queryParams.dateRange = []; selectedDeptId.value = null; page.value = 1; };
    const handleSelectionChange = (val) => { selectedIds.value = val.map(v => v.id); };

    /* ===== 新增/编辑 ===== */
    const dialogVisible = ref(false);
    const editing = ref(false);
    const formRef = ref(null);
    const form = reactive({ id: null, username: '', nickname: '', password: '', deptId: null, phone: '', email: '', sex: '0', status: '0', remark: '' });
    const rules = {
      username: [{ required: true, message: '请输入用户名', trigger: 'blur' }, { min: 2, max: 20, message: '长度在 2 到 20 个字符', trigger: 'blur' }],
      nickname: [{ required: true, message: '请输入姓名', trigger: 'blur' }],
      password: [{ required: true, message: '请输入密码', trigger: 'blur' }, { min: 5, max: 20, message: '长度在 5 到 20 个字符', trigger: 'blur' }],
      deptId: [{ required: true, message: '请选择归属部门', trigger: 'change' }],
      email: [{ type: 'email', message: '请输入正确的邮箱', trigger: 'blur' }],
    };
    const resetForm = () => { Object.assign(form, { id: null, username: '', nickname: '', password: '', deptId: null, phone: '', email: '', sex: '0', status: '0', remark: '' }); };
    const onDialogClose = () => { formRef.value?.clearValidate(); };
    const handleAdd = () => { resetForm(); editing.value = false; dialogVisible.value = true; };
    const handleEdit = (row) => { resetForm(); Object.assign(form, JSON.parse(JSON.stringify(row))); editing.value = true; dialogVisible.value = true; };
    const submitForm = async () => {
      try { await formRef.value.validate(); } catch { return; }
      if (editing.value) {
        const idx = users.findIndex(u => u.id === form.id);
        if (idx > -1) Object.assign(users[idx], form);
        ElementPlus.ElMessage.success('修改成功');
      } else {
        if (users.some(u => u.username === form.username)) { ElementPlus.ElMessage.error('用户名已存在'); return; }
        const newId = Math.max(...users.map(u => u.id), 0) + 1;
        users.push({ ...form, id: newId, createTime: new Date().toISOString().slice(0, 19).replace('T', ' ') });
        ElementPlus.ElMessage.success('新增成功');
      }
      dialogVisible.value = false;
    };

    /* ===== 删除 ===== */
    const handleDelete = (row) => {
      ElementPlus.ElMessageBox.confirm(`确认删除用户「${row.nickname}」吗？`, '提示', { type: 'warning' })
        .then(() => {
          const idx = users.findIndex(u => u.id === row.id);
          if (idx > -1) users.splice(idx, 1);
          ElementPlus.ElMessage.success('删除成功');
        }).catch(() => {});
    };
    const handleBatchDelete = () => {
      if (!selectedIds.value.length) { ElementPlus.ElMessage.warning('请选择要删除的用户'); return; }
      ElementPlus.ElMessageBox.confirm(`确认删除选中的 ${selectedIds.value.length} 条用户数据吗？`, '提示', { type: 'warning' })
        .then(() => {
          selectedIds.value.forEach(id => {
            const idx = users.findIndex(u => u.id === id);
            if (idx > -1) users.splice(idx, 1);
          });
          ElementPlus.ElMessage.success('删除成功');
        }).catch(() => {});
    };

    /* ===== 状态切换 ===== */
    const handleStatusChange = (row) => {
      const text = row.status === '0' ? '启用' : '停用';
      ElementPlus.ElMessageBox.confirm(`确认要${text}用户「${row.nickname}」吗？`, '提示', { type: 'warning' })
        .then(() => { ElementPlus.ElMessage.success(text + '成功'); })
        .catch(() => { row.status = row.status === '0' ? '1' : '0'; });
    };

    /* ===== 重置密码 ===== */
    const resetPwdVisible = ref(false);
    const resetFormRef = ref(null);
    const resetTarget = ref(null);
    const resetPwdForm = reactive({ password: '', confirmPassword: '' });
    const resetRules = {
      password: [{ required: true, message: '请输入新密码', trigger: 'blur' }, { min: 5, max: 20, message: '长度在 5 到 20 个字符', trigger: 'blur' }],
      confirmPassword: [{ required: true, message: '请再次输入密码', trigger: 'blur' }, { validator: (r, v, cb) => { v !== resetPwdForm.password ? cb(new Error('两次输入的密码不一致')) : cb(); }, trigger: 'blur' }],
    };
    const handleResetPwd = (row) => {
      resetTarget.value = row;
      resetPwdForm.password = ''; resetPwdForm.confirmPassword = '';
      resetPwdVisible.value = true;
    };
    const submitResetPwd = async () => {
      try { await resetFormRef.value.validate(); } catch { return; }
      ElementPlus.ElMessage.success('密码重置成功');
      resetPwdVisible.value = false;
    };

    /* ===== 分配角色 ===== */
    const allRoles = reactive(SD ? SD.ROLES.map(r => ({ ...r })) : []);
    const userRoles = reactive(SD ? SD.USER_ROLES.map(ur => ({ ...ur })) : []);
    const assignRoleVisible = ref(false);
    const assignTarget = ref(null);
    const selectedRoleIds = ref([]);
    const handleAssignRole = (row) => {
      assignTarget.value = row;
      selectedRoleIds.value = userRoles.filter(ur => ur.userId === row.id).map(ur => ur.roleId);
      assignRoleVisible.value = true;
    };
    const handleRoleSelection = (val) => { selectedRoleIds.value = val.map(v => v.id); };
    const submitAssignRole = () => {
      if (!assignTarget.value) return;
      const userId = assignTarget.value.id;
      const existing = userRoles.filter(ur => ur.userId === userId);
      existing.forEach(ur => { const idx = userRoles.indexOf(ur); if (idx > -1) userRoles.splice(idx, 1); });
      selectedRoleIds.value.forEach(roleId => userRoles.push({ userId, roleId }));
      ElementPlus.ElMessage.success('分配角色成功');
      assignRoleVisible.value = false;
    };

    /* ===== 导入导出（占位） ===== */
    const handleImport = () => { ElementPlus.ElMessage.info('导入功能开发中'); };
    const handleExport = () => { ElementPlus.ElMessage.info('导出功能开发中'); };

    return { ...shared,
      deptTree, deptName, selectedDeptId, handleDeptClick,
      users, filteredList, pagedList, page, pageSize, queryParams, selectedIds,
      handleQuery, resetQuery, handleSelectionChange,
      dialogVisible, editing, formRef, form, rules, onDialogClose, handleAdd, handleEdit, submitForm,
      handleDelete, handleBatchDelete, handleStatusChange,
      resetPwdVisible, resetFormRef, resetTarget, resetPwdForm, resetRules, handleResetPwd, submitResetPwd,
      allRoles, assignRoleVisible, assignTarget, selectedRoleIds, handleAssignRole, handleRoleSelection, submitAssignRole,
      handleImport, handleExport,
      Plus: ElementPlusIconsVue?.Plus, Edit: ElementPlusIconsVue?.Edit, Delete: ElementPlusIconsVue?.Delete,
      Search: ElementPlusIconsVue?.Search, Refresh: ElementPlusIconsVue?.Refresh,
      Key: ElementPlusIconsVue?.Key, CircleCheck: ElementPlusIconsVue?.CircleCheck,
      Upload: ElementPlusIconsVue?.Upload, Download: ElementPlusIconsVue?.Download,
      OfficeBuilding: ElementPlusIconsVue?.OfficeBuilding, Expand: ElementPlusIconsVue?.Expand,
      ArrowDown: ElementPlusIconsVue?.ArrowDown, Check: ElementPlusIconsVue?.Check,
    };
  }
});
app.use(ElementPlus);
if (window.ElementPlusIconsVue) {
  for (const [k, v] of Object.entries(window.ElementPlusIconsVue)) app.component(k, v);
}
app.mount('#app');
  </script>
</body>
</html>
